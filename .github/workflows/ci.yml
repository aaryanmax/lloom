name: CI

on:
  push:
    paths: ["lloom-lab/**", ".github/workflows/ci.yml"]
  pull_request:
    paths: ["lloom-lab/**", ".github/workflows/ci.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lloom-lab
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package + dev tools
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Tests (offline)
        run: pytest -m "not live"
