[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lloom-lab"
version = "0.1.0"
description = "How Many Examples Does It Take? — sample-complexity and capacity analysis of LLM concept induction (LLooM, arXiv:2404.12259)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "AML-Project" }]
dependencies = [
    "httpx>=0.27",
    "google-genai>=1.0",
    "fastembed>=0.4",
    "scikit-learn>=1.5",
    "bertopic>=0.16",
    "umap-learn>=0.5",
    "streamlit>=1.40",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
]

[project.scripts]
build-dataset = "lloom_lab.data.build:main"

[tool.hatch.build.targets.wheel]
packages = ["src/lloom_lab"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
# E402: scripts/ intentionally import after sys.path setup
ignore = ["E402"]

[tool.ruff.lint.per-file-ignores]
# sentences.py is data: hand-written sentences are natural-length strings.
"src/lloom_lab/data/sentences.py" = ["E501"]
# Prompt templates and toy documents are long literal strings.
"src/lloom_lab/pipeline/distill.py" = ["E501"]
"scripts/smoke_e2e.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "live: requires running llama-server and/or real API access (deselected by default)",
]
